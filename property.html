<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Book a stay — Nyumba254</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ink:#1A170F;
    --paper:#FAF7EF;
    --paper-2:#F1EBDC;
    --forest:#0F6E56;
    --forest-deep:#0A4B3B;
    --forest-mist:#E3F0E9;
    --clay:#A8542A;
    --clay-deep:#7C3D1C;
    --clay-mist:#F5E6D5;
    --line:#E2DCC9;
    --text:#1A170F;
    --text-2:#57534A;
    --text-3:#928D7C;
    --red:#B3261E;
    --red-mist:#FBEAE6;
    --white:#FFFFFF;
    --radius-sm:6px;
    --radius:10px;
    --radius-lg:20px;
    --shadow:0 1px 2px rgba(26,23,15,.05),0 8px 24px rgba(26,23,15,.06);
    --shadow-lg:0 24px 56px rgba(26,23,15,.16);
  }
  body{font-family:'Inter',sans-serif;color:var(--text);background:var(--paper);line-height:1.6;font-size:15px}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  button{font-family:inherit;cursor:pointer}
  h1,h2,h3{font-family:'Fraunces',serif;font-optical-sizing:auto;font-weight:600;color:var(--text)}

  /* ── Topbar ────────────────────────────────────────────── */
  .topbar{position:sticky;top:0;z-index:50;background:var(--white);border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:1180px;margin:0 auto;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand-mark{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--forest);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .brand-mark svg{width:16px;height:16px;stroke:var(--forest);fill:none;stroke-width:1.8}
  .brand-name{font-family:'Fraunces',serif;font-size:18px;font-weight:600;letter-spacing:-.01em}
  .back-link{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--text-2)}
  .back-link:hover{color:var(--forest)}
  .back-link svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--radius);font-weight:600;font-size:14.5px;padding:14px 20px;transition:background .15s;width:100%;border:none}
  .btn-primary{background:var(--forest-deep);color:white}
  .btn-primary:hover{background:#083f32}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}

  .wrap{max-width:1180px;margin:0 auto;padding:32px 28px 64px}

  /* ── Gallery ───────────────────────────────────────────── */
  .gallery-frame{position:relative;margin-bottom:30px}
  .gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;border-radius:var(--radius-lg);overflow:hidden;height:430px;border:1px solid var(--line)}
  .gallery img,.gallery .no-photo{width:100%;height:100%;object-fit:cover;background:var(--forest-mist)}
  .gallery a:nth-child(1){grid-row:1/3}
  .no-photo{display:flex;align-items:center;justify-content:center;color:var(--forest)}
  .no-photo svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.3}
  .stamp{position:absolute;left:20px;bottom:20px;width:104px;height:104px;border-radius:50%;background:rgba(250,247,239,.92);border:1.5px dashed var(--clay);display:flex;align-items:center;justify-content:center;text-align:center;transform:rotate(-9deg);pointer-events:none}
  .stamp span{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--clay-deep);line-height:1.5}
  @media(max-width:760px){.gallery{grid-template-columns:1fr;grid-template-rows:none;height:260px}.gallery a:not(:first-child){display:none}.stamp{width:84px;height:84px;left:14px;bottom:14px}.stamp span{font-size:8px}}

  /* ── Content layout ────────────────────────────────────── */
  .layout{display:grid;grid-template-columns:1.6fr 1fr;gap:48px;align-items:start}
  @media(max-width:900px){.layout{grid-template-columns:1fr}}

  .title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:6px;flex-wrap:wrap}
  .title-row h1{font-size:27px;letter-spacing:-.01em}
  .verified-badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--forest-deep);background:var(--forest-mist);padding:6px 13px;border-radius:20px;flex-shrink:0;white-space:nowrap}
  .verified-badge svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
  .subtitle{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text-3);margin-bottom:24px}
  .subtitle svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}

  .facts{display:flex;border:1px dashed var(--line);border-radius:14px;margin-bottom:26px;overflow:hidden}
  .fact{flex:1;padding:16px 20px;border-right:1px dashed var(--line)}
  .fact:last-child{border-right:none}
  .fact strong{display:block;font-family:'Fraunces',serif;font-size:21px;font-weight:600;color:var(--forest-deep)}
  .fact .fact-label{font-size:12.5px;color:var(--text-3)}

  .desc{font-size:14.5px;color:var(--text-2);margin-bottom:30px;max-width:60ch}

  .amenities-title{font-size:15px;margin-bottom:12px}
  .amenity-chip{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);padding:9px 12px;background:var(--white);border:1px solid var(--line);border-radius:8px}
  .amenity-chip svg{flex-shrink:0}

  .cal-section h2{font-size:19px;margin-bottom:14px}
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-nav button{background:white;border:1.5px solid var(--line);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
  .cal-nav button:hover{border-color:var(--forest);color:var(--forest)}
  .cal-nav button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
  .cal-nav span{font-family:'Fraunces',serif;font-size:15px;font-weight:600}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-dow{font-size:11px;font-weight:600;color:var(--text-3);text-align:center;padding:4px 0}
  .cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12.5px;border-radius:8px;color:var(--text-2)}
  .cal-day.blank{visibility:hidden}
  .cal-day.past{color:var(--text-3);opacity:.35}
  .cal-day.booked{background:var(--red-mist);color:var(--red);text-decoration:line-through}
  .cal-day.open{background:var(--forest-mist);color:var(--forest-deep);font-weight:600}
  .cal-legend{display:flex;gap:18px;margin-top:14px;font-size:12px;color:var(--text-3)}
  .cal-legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:3px;display:inline-block}

  /* ── Booking widget ────────────────────────────────────── */
  .widget{position:sticky;top:84px;background:white;border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);overflow:hidden}
  .widget-price-block{background:var(--forest-deep);color:white;padding:22px 22px 16px}
  .widget-price{font-family:'Fraunces',serif;font-size:25px;font-weight:600}
  .widget-price span{font-size:12.5px;font-weight:400;color:rgba(255,255,255,.68)}
  .ticket-notch{height:14px;margin-top:-1px;background:radial-gradient(circle 7px at 7px 0,var(--paper) 7px,transparent 7.5px) repeat-x;background-size:22px 14px;background-color:var(--forest-deep)}
  .widget-body{padding:20px 22px 22px}
  .widget-error{font-size:12.5px;color:var(--red);background:var(--red-mist);border-radius:8px;padding:10px 12px;margin-bottom:14px;display:none}
  .widget-dates{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
  .widget-dates .f{padding:10px 12px;border-right:1px solid var(--line)}
  .widget-dates .f:last-child{border-right:none}
  .widget-dates label{display:block;font-size:11px;font-weight:600;color:var(--text-3);margin-bottom:3px}
  .widget-dates input{border:none;outline:none;font-size:13px;width:100%;font-family:inherit;color:var(--text)}
  .field-block{margin-bottom:16px}
  .field-block label{display:block;font-size:11.5px;font-weight:600;color:var(--text-3);margin-bottom:6px}
  .field-block select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:13.5px;outline:none;font-family:inherit;color:var(--text)}
  .price-breakdown{margin:4px 0 18px;padding-top:16px;border-top:1px dashed var(--line);font-size:13.5px}
  .price-breakdown div{display:flex;justify-content:space-between;padding:5px 0;color:var(--text-2)}
  .price-breakdown .total{font-weight:700;color:var(--text);border-top:1px solid var(--line);margin-top:7px;padding-top:11px;font-family:'Fraunces',serif;font-size:15px}
  .widget-note{font-size:11.5px;color:var(--text-3);text-align:center;margin-top:12px}

  .state{text-align:center;padding:90px 20px;color:var(--text-3)}
  .state h1{font-size:21px;margin-bottom:8px;color:var(--text)}
  footer{background:var(--forest-deep);color:rgba(255,255,255,0.72);padding:36px 28px;text-align:center;font-size:12.5px;margin-top:8px}
  footer a{color:rgba(255,255,255,0.95);font-weight:600}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg></div>
      <div class="brand-name">Nyumba254</div>
    </div>
    <a href="index.html" class="back-link"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>Back to search</a>
  </div>
</div>

<div class="wrap" id="page-content">
  <div class="state" id="loading-state">Loading stay…</div>
</div>

<footer><p>Nyumba254 — book directly, no agent fees. <a href="index.html">Browse more stays</a></p></footer>

<script>
const SUPABASE_URL='https://vliuuloyfhyxcsuchpss.supabase.co';
const SUPABASE_KEY='sb_publishable_oIIcecf3wzKMual5K24Z8Q_zmxVfgsx';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const params=new URLSearchParams(location.search);
const propertyId=params.get('id');
let property=null, bookedRanges=[], calMonth=new Date();
calMonth.setDate(1);

function escHtml(s){ if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(d){ return d.toISOString().slice(0,10); }
function nightsBetween(a,b){ return Math.max(0,Math.round((new Date(b)-new Date(a))/86400000)); }

function isDateBooked(dateStr){
  return bookedRanges.some(r=>dateStr>=r.check_in && dateStr<r.check_out);
}
function rangeOverlapsBooked(ci,co){
  return bookedRanges.some(r=> ci < r.check_out && co > r.check_in);
}

async function loadProperty(){
  if(!propertyId){ renderNotFound(); return; }
  try{
    const{data,error}=await db.from('bnb_properties')
      .select('id,property_label,description,photos,amenities,nightly_rate,weekend_rate,cleaning_fee,notes,max_guests,min_stay_nights,is_publicly_bookable,listing_id,listings(title,area,county,address,description,amenities,listing_photos(url,is_cover))')
      .eq('id',propertyId).maybeSingle();
    if(error||!data||!data.is_publicly_bookable){ renderNotFound(); return; }
    const linkedHasPhotos=(data.listings?.listing_photos||[]).length>0;
    const ownHasPhotos=Array.isArray(data.photos)&&data.photos.length>0;
    if(!linkedHasPhotos&&!ownHasPhotos){ renderNotFound(); return; }
    property=data;

    let avail=await db.from('public_bnb_availability').select('check_in,check_out').eq('bnb_property_id',propertyId);
    if(avail.error){
      avail=await db.from('bnb_bookings').select('check_in,check_out,status').eq('bnb_property_id',propertyId).neq('status','cancelled');
    }
    bookedRanges=(avail.data||[]).map(r=>({check_in:r.check_in,check_out:r.check_out}));

    renderPage();
  }catch(err){
    console.error('loadProperty failed:',err);
    renderNotFound();
  }
}

const AMENITY_LABELS = {
  has_water:'Water supply', has_electricity:'Electricity', has_security:'Security', has_solar:'Solar power',
  has_wifi:'WiFi', has_parking:'Parking', has_balcony:'Balcony', has_private_bathroom:'Private bathroom',
  has_shared_bathroom:'Shared bathroom', has_study_area:'Study area', has_gym:'Gym', has_pool:'Swimming pool',
  has_pets_allowed:'Pets allowed', has_backup_power:'Backup power',
};
function amenitiesHtml(list){
  if(!Array.isArray(list)||!list.length) return '';
  const items=list.filter(k=>AMENITY_LABELS[k]);
  if(!items.length) return '';
  return `<div style="margin:20px 0 6px">
    <h3 class="amenities-title">What this place offers</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px">
      ${items.map(k=>`<div class="amenity-chip"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="var(--forest)" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg>${escHtml(AMENITY_LABELS[k])}</div>`).join('')}
    </div></div>`;
}

function renderNotFound(){
  document.getElementById('page-content').innerHTML=`<div class="state">
    <h1>This stay isn't available</h1>
    <p>It may have been removed, or the host has turned off direct booking. <a href="index.html" style="color:var(--forest);font-weight:600">Browse other stays →</a></p>
  </div>`;
}

function galleryHtml(photos){
  const shown=(photos&&photos.length?photos:[null,null,null]).slice(0,3);
  return shown.map(url=>url
    ? `<a href="${escHtml(url)}" target="_blank"><img src="${escHtml(url)}" alt="${escHtml(property.property_label)}"/></a>`
    : `<div class="no-photo"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`
  ).join('');
}

function renderPage(){
  const linkedPhotos=(property.listings?.listing_photos||[]).sort((a,b)=>(b.is_cover?1:0)-(a.is_cover?1:0)).map(p=>p.url);
  const photos = linkedPhotos.length ? linkedPhotos : (Array.isArray(property.photos)?property.photos:[]);
  const area=property.listings?.area||'Kenya';
  const county=property.listings?.county||'';
  document.getElementById('page-content').innerHTML=`
    <div class="gallery-frame">
      <div class="gallery">${galleryHtml(photos)}</div>
      <div class="stamp"><span>DIRECT<br/>BOOKING<br/>NO AGENT</span></div>
    </div>
    <div class="layout">
      <div>
        <div class="title-row">
          <h1>${escHtml(property.listings?.title || property.property_label)}</h1>
          <span class="verified-badge"><svg viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/><polyline points="9 12 11 14 15 10"/></svg>Verified host</span>
        </div>
        <div class="subtitle"><svg viewBox="0 0 24 24"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>${escHtml(area)}${county?', '+escHtml(county):''}${property.listings?.address?' · '+escHtml(property.listings.address):''}</div>

        <div class="facts">
          <div class="fact"><strong>${property.max_guests||'—'}</strong><span class="fact-label">guests max</span></div>
          <div class="fact"><strong>${property.min_stay_nights||1}</strong><span class="fact-label">night min. stay</span></div>
          <div class="fact"><strong>KES ${Number(property.cleaning_fee||0).toLocaleString('en-KE')}</strong><span class="fact-label">cleaning fee</span></div>
        </div>

        <p class="desc">${escHtml(property.listings?.description||property.description||property.notes||'Contact the host after booking for full details about this stay.')}</p>
        ${amenitiesHtml((property.listings?.amenities&&property.listings.amenities.length)?property.listings.amenities:property.amenities)}

        <div class="cal-section">
          <h2>Availability</h2>
          <div class="cal-nav">
            <button id="cal-prev" aria-label="Previous month"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
            <span id="cal-label"></span>
            <button id="cal-next" aria-label="Next month"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
          <div class="cal-legend">
            <span><i class="dot" style="background:var(--forest-mist)"></i>Open</span>
            <span><i class="dot" style="background:var(--red-mist)"></i>Booked</span>
          </div>
        </div>
      </div>

      <div class="widget">
        <div class="widget-price-block">
          <div class="widget-price">KES ${Number(property.nightly_rate||0).toLocaleString('en-KE')}<span> / night</span></div>
        </div>
        <div class="ticket-notch"></div>
        <div class="widget-body">
          <div class="widget-error" id="widget-error"></div>
          <div class="widget-dates">
            <div class="f"><label>Check-in</label><input type="date" id="w-checkin"/></div>
            <div class="f"><label>Check-out</label><input type="date" id="w-checkout"/></div>
          </div>
          <div class="field-block">
            <label>Guests</label>
            <select id="w-guests">${Array.from({length:property.max_guests||6},(_,i)=>i+1).map(n=>`<option value="${n}">${n} guest${n!==1?'s':''}</option>`).join('')}</select>
          </div>
          <div class="price-breakdown" id="price-breakdown" style="display:none"></div>
          <button class="btn btn-primary" id="btn-reserve">Reserve</button>
          <div class="widget-note">You won't be charged yet</div>
        </div>
      </div>
    </div>
  `;
  renderCalendar();
  wireWidget();
}

function renderCalendar(){
  const label=document.getElementById('cal-label');
  const grid=document.getElementById('cal-grid');
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  label.textContent=calMonth.toLocaleDateString('en-KE',{month:'long',year:'numeric'});
  const firstDow=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const todayStr=fmtDate(new Date());
  let html=['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<firstDow;i++) html+=`<div class="cal-day blank"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=fmtDate(new Date(y,m,d));
    const isPast=dateStr<todayStr;
    const booked=isDateBooked(dateStr);
    const cls=isPast?'past':(booked?'booked':'open');
    html+=`<div class="cal-day ${cls}">${d}</div>`;
  }
  grid.innerHTML=html;
  document.getElementById('cal-prev').onclick=()=>{ calMonth.setMonth(calMonth.getMonth()-1); renderCalendar(); };
  document.getElementById('cal-next').onclick=()=>{ calMonth.setMonth(calMonth.getMonth()+1); renderCalendar(); };
}

function wireWidget(){
  const ci=document.getElementById('w-checkin'), co=document.getElementById('w-checkout');
  const today=new Date(), tmrw=new Date(Date.now()+86400000);
  ci.min=fmtDate(today); co.min=fmtDate(tmrw);
  ci.addEventListener('change',()=>{
    const d=new Date(ci.value); d.setDate(d.getDate()+(property.min_stay_nights||1));
    co.min=fmtDate(d);
    if(co.value&&co.value<co.min) co.value=fmtDate(d);
    updatePricing();
  });
  co.addEventListener('change',updatePricing);
  document.getElementById('w-guests').addEventListener('change',updatePricing);
  document.getElementById('btn-reserve').addEventListener('click',handleReserve);
}

function updatePricing(){
  const ci=document.getElementById('w-checkin').value, co=document.getElementById('w-checkout').value;
  const box=document.getElementById('price-breakdown');
  const errEl=document.getElementById('widget-error');
  errEl.style.display='none';
  if(!ci||!co){ box.style.display='none'; return; }
  const nights=nightsBetween(ci,co);
  if(nights<(property.min_stay_nights||1)){
    errEl.textContent=`This stay requires a minimum of ${property.min_stay_nights||1} night(s).`;
    errEl.style.display='block';
    box.style.display='none';
    return;
  }
  if(rangeOverlapsBooked(ci,co)){
    errEl.textContent='Those dates overlap an existing booking — try different dates.';
    errEl.style.display='block';
    box.style.display='none';
    return;
  }
  const nightlyTotal=nights*Number(property.nightly_rate||0);
  const cleaning=Number(property.cleaning_fee||0);
  const total=nightlyTotal+cleaning;
  box.style.display='block';
  box.innerHTML=`
    <div><span>KES ${Number(property.nightly_rate).toLocaleString('en-KE')} × ${nights} night${nights!==1?'s':''}</span><span>KES ${nightlyTotal.toLocaleString('en-KE')}</span></div>
    ${cleaning?`<div><span>Cleaning fee</span><span>KES ${cleaning.toLocaleString('en-KE')}</span></div>`:''}
    <div class="total"><span>Total</span><span>KES ${total.toLocaleString('en-KE')}</span></div>
  `;
}

function handleReserve(){
  const ci=document.getElementById('w-checkin').value, co=document.getElementById('w-checkout').value;
  const guests=document.getElementById('w-guests').value;
  const errEl=document.getElementById('widget-error');
  if(!ci||!co){ errEl.textContent='Please choose check-in and check-out dates.'; errEl.style.display='block'; return; }
  const nights=nightsBetween(ci,co);
  if(nights<(property.min_stay_nights||1)){ errEl.textContent=`This stay requires a minimum of ${property.min_stay_nights||1} night(s).`; errEl.style.display='block'; return; }
  if(rangeOverlapsBooked(ci,co)){ errEl.textContent='Those dates overlap an existing booking — try different dates.'; errEl.style.display='block'; return; }
  errEl.style.display='none';
  const q=new URLSearchParams({property:propertyId,checkin:ci,checkout:co,guests}).toString();
  location.href=`checkout.html?${q}`;
}

loadProperty();
</script>
</body>
</html>
